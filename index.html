<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Sensibilidades Free Fire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 550px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        select, input[type="radio"] {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-item input[type="radio"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .radio-item label {
            margin-bottom: 0;
            font-weight: normal;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .sensibility-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .sensibility-item strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .sensibility-value {
            color: #d9534f;
            font-size: 22px;
            font-weight: bold;
        }

        .sensibility-description {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .copy-btn {
            background: #5cb85c;
            padding: 8px 12px;
            font-size: 12px;
            margin-top: 10px;
            width: auto;
        }

        .copy-btn:hover {
            background: #4cae4c;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #1565c0;
        }

        .stability-indicator {
            margin-top: 8px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .stability-high {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .stability-medium {
            background: #fff9c4;
            color: #f57f17;
        }

        .sensitivity-range {
            margin-top: 10px;
            padding: 10px;
            background: #fce4ec;
            border-left: 4px solid #c2185b;
            border-radius: 4px;
            font-size: 12px;
            color: #880e4f;
        }

        .dpi-adjustment {
            background: #f3e5f5;
            border-left: 4px solid #7b1fa2;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #4a148c;
            margin-top: 8px;
        }

        .warning-box {
            background: #ffebee;
            border-left: 4px solid #d32f2f;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #b71c1c;
            margin-top: 8px;
        }

        .calibration-tips {
            background: #e8f5e9;
            border-left: 4px solid #388e3c;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .calibration-tips strong {
            color: #1b5e20;
            display: block;
            margin-bottom: 8px;
        }

        .calibration-tips ul {
            margin-left: 20px;
            font-size: 12px;
            color: #2e7d32;
        }

        .calibration-tips li {
            margin-bottom: 5px;
        }

        .tabla-sensibilidades {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            font-size: 12px;
        }

        .tabla-sensibilidades th,
        .tabla-sensibilidades td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .tabla-sensibilidades th {
            background: #667eea;
            color: white;
        }

        .tabla-sensibilidades tr:nth-child(even) {
            background: #f9f9f9;
        }

        .hidden {
            display: none;
        }

        .badge-active {
            background: #4caf50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 Generador de Sensibilidades <span class="badge-active">✓ ACTIVO</span></h1>
            <p>Free Fire - Calibrado para Fluidez y Estabilidad (Max: 200)</p>
        </div>

        <div class="info-box">
            ℹ️ <strong>✓ GENERADOR ACTIVADO</strong> - Sensibilidades calibradas para máxima FLUIDEZ, ESTABILIDAD y PRECISIÓN. Valores optimizados hasta 200 (máximo del juego).
        </div>

        <form id="sensibilityForm">
            <!-- Plataforma -->
            <div class="form-group">
                <label>📱 Plataforma</label>
                <select id="platform" required>
                    <option value="">Selecciona una plataforma</option>
                    <option value="android">Android</option>
                    <option value="iphone">iPhone</option>
                </select>
            </div>

            <!-- Arma -->
            <div class="form-group">
                <label>🔫 Arma</label>
                <select id="weapon" required>
                    <option value="">Selecciona una arma</option>
                    <option value="ak47">AK47 - AR (Retroceso Alto)</option>
                    <option value="m14">M14 - AR (Retroceso Medio-Alto)</option>
                    <option value="scar">SCAR - AR (Retroceso Balanceado)</option>
                    <option value="mp40">MP40 - SMG (Retroceso Bajo)</option>
                    <option value="shotgun">Escopeta - Shotgun (Alcance Corto)</option>
                    <option value="sniper">Francotirador - Sniper (Precisión Pura)</option>
                    <option value="awm">AWM - Sniper (One-Shot)</option>
                    <option value="groza">GROZA - AR/SMG (Híbrido)</option>
                    <option value="deagle">Deagle - Pistola (Precisión)</option>
                </select>
            </div>

            <!-- Nivel de Sensibilidad -->
            <div class="form-group">
                <label>⚡ Nivel de Sensibilidad</label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="sensLow" name="sensitivity" value="low" required>
                        <label for="sensLow">Baja 🎯</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="sensMedium" name="sensitivity" value="medium">
                        <label for="sensMedium">Media ⚡</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="sensHigh" name="sensitivity" value="high">
                        <label for="sensHigh">Alta 🚀</label>
                    </div>
                </div>
            </div>

            <!-- DPI -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="useDpi">
                    <label for="useDpi">¿Usar DPI? (Ajuste Avanzado)</label>
                </div>
            </div>

            <!-- DPI Input -->
            <div class="form-group" id="dpiGroup" style="display: none;">
                <label>🎯 Valor DPI (Rango: 400-3200)</label>
                <input type="number" id="dpiValue" placeholder="Ej: 400, 800, 1600, 3200" min="400" max="3200" step="100">
            </div>

            <!-- Botón Generar -->
            <button type="submit" class="btn">⚙️ Generar Sensibilidades Calibradas</button>
        </form>

        <!-- Resultado -->
        <div id="result" class="result">
            <h2>📊 Tu Configuración Optimizada</h2>
            <div id="resultContent"></div>
            <button class="btn copy-btn" onclick="copiarResultado()">📋 Copiar Configuración</button>
        </div>
    </div>

    <script>
        // Mostrar/ocultar input DPI
        document.getElementById('useDpi').addEventListener('change', function() {
            document.getElementById('dpiGroup').style.display = this.checked ? 'block' : 'none';
            if (!this.checked) {
                document.getElementById('dpiValue').value = '';
            }
        });

        // Datos de sensibilidades calibradas - MÁXIMO 200, FLUIDAS Y ESTABLES
        const sensibilityData = {
            ak47: {
                // AK47: Retroceso ALTO - Necesita sensibilidad MÁS BAJA para control
                low: { android: 85, iphone: 80, stability: "Muy Alta", fluidity: "Excelente" },
                medium: { android: 110, iphone: 105, stability: "Alta", fluidity: "Buena" },
                high: { android: 140, iphone: 135, stability: "Media", fluidity: "Rápida" }
            },
            m14: {
                // M14: Retroceso MEDIO-ALTO
                low: { android: 90, iphone: 85, stability: "Muy Alta", fluidity: "Excelente" },
                medium: { android: 120, iphone: 115, stability: "Alta", fluidity: "Buena" },
                high: { android: 155, iphone: 150, stability: "Media", fluidity: "Rápida" }
            },
            scar: {
                // SCAR: Retroceso BALANCEADO - El más versátil
                low: { android: 88, iphone: 83, stability: "Muy Alta", fluidity: "Excelente" },
                medium: { android: 115, iphone: 110, stability: "Alta", fluidity: "Buena" },
                high: { android: 145, iphone: 140, stability: "Media", fluidity: "Rápida" }
            },
            mp40: {
                // MP40: Retroceso BAJO - Puede permitir sens más alta
                low: { android: 75, iphone: 70, stability: "Muy Alta", fluidity: "Excelente" },
                medium: { android: 100, iphone: 95, stability: "Muy Alta", fluidity: "Excelente" },
                high: { android: 130, iphone: 125, stability: "Alta", fluidity: "Rápida" }
            },
            shotgun: {
                // Escopeta: Alcance CORTO - Sens alta pero controlada
                low: { android: 70, iphone: 65, stability: "Muy Alta", fluidity: "Excelente" },
                medium: { android: 95, iphone: 90, stability: "Muy Alta", fluidity: "Excelente" },
                high: { android: 125, iphone: 120, stability: "Alta", fluidity: "Muy Rápida" }
            },
            sniper: {
                // Francotirador: PRECISIÓN PURA - Baja sensibilidad siempre
                low: { android: 105, iphone: 100, stability: "Perfecta", fluidity: "Precisa" },
                medium: { android: 135, iphone: 130, stability: "Muy Alta", fluidity: "Precisa" },
                high: { android: 165, iphone: 160, stability: "Alta", fluidity: "Rápida" }
            },
            awm: {
                // AWM: One-Shot - Máxima precisión
                low: { android: 110, iphone: 105, stability: "Perfecta", fluidity: "Precisa" },
                medium: { android: 145, iphone: 140, stability: "Muy Alta", fluidity: "Precisa" },
                high: { android: 175, iphone: 170, stability: "Alta", fluidity: "Rápida" }
            },
            groza: {
                // GROZA: Híbrido AR/SMG - Versátil
                low: { android: 82, iphone: 77, stability: "Muy Alta", fluidity: "Excelente" },
                medium: { android: 108, iphone: 103, stability: "Alta", fluidity: "Buena" },
                high: { android: 138, iphone: 133, stability: "Media", fluidity: "Rápida" }
            },
            deagle: {
                // Deagle: Precisión - Sem muy precisa
                low: { android: 80, iphone: 75, stability: "Muy Alta", fluidity: "Excelente" },
                medium: { android: 110, iphone: 105, stability: "Muy Alta", fluidity: "Excelente" },
                high: { android: 140, iphone: 135, stability: "Alta", fluidity: "Rápida" }
            }
        };

        // Nombres de armas en español
        const weaponNames = {
            ak47: 'AK47 (AR)',
            m14: 'M14 (AR)',
            scar: 'SCAR (AR)',
            mp40: 'MP40 (SMG)',
            shotgun: 'Escopeta',
            sniper: 'Francotirador',
            awm: 'AWM',
            groza: 'GROZA (Híbrido)',
            deagle: 'Deagle'
        };

        const weaponTypes = {
            ak47: 'Fusil de Asalto (Alto Retroceso)',
            m14: 'Fusil de Asalto (Retroceso Medio-Alto)',
            scar: 'Fusil de Asalto (Retroceso Balanceado)',
            mp40: 'Subfusil (Retroceso Bajo)',
            shotgun: 'Escopeta (Alcance Corto)',
            sniper: 'Francotirador (Precisión Pura)',
            awm: 'Francotirador (One-Shot)',
            groza: 'Híbrido AR/SMG',
            deagle: 'Pistola (Precisión)'
        };

        // Formulario submit
        document.getElementById('sensibilityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generarSensibilidades();
        });

        function generarSensibilidades() {
            const platform = document.getElementById('platform').value;
            const weapon = document.getElementById('weapon').value;
            const sensitivity = document.querySelector('input[name="sensitivity"]:checked').value;
            const useDpi = document.getElementById('useDpi').checked;
            const dpiValue = document.getElementById('dpiValue').value;

            if (!platform || !weapon || !sensitivity) {
                alert('Por favor completa todos los campos requeridos');
                return;
            }

            const baseData = sensibilityData[weapon][sensitivity];
            let finalValue = baseData[platform];
            
            // Validar que no exceda 200
            if (finalValue > 200) {
                finalValue = 200;
            }

            let dpiInfo = '';
            let dpiAdjustedValue = finalValue;
            
            if (useDpi && dpiValue) {
                // Ajuste DPI: valores más altos de DPI = sensibilidad más baja
                const dpiBase = 400;
                const dpiRatio = dpiValue / dpiBase;
                dpiAdjustedValue = Math.round(finalValue / (dpiRatio * 0.8));
                
                // Asegurar que esté en rango válido (1-200)
                dpiAdjustedValue = Math.max(1, Math.min(200, dpiAdjustedValue));
                dpiInfo = ` (con DPI: ${dpiValue})`;
            }

            const platformName = platform === 'android' ? '📱 Android' : '🍎 iPhone';
            const sensitivityName = sensitivity === 'low' ? 'Baja 🎯 (Control Máximo)' : sensitivity === 'medium' ? 'Media ⚡ (Equilibrio)' : 'Alta 🚀 (Velocidad)';

            let resultHTML = `
                <div class="sensibility-item">
                    <strong>📱 Plataforma:</strong>
                    ${platformName}
                </div>
                <div class="sensibility-item">
                    <strong>🔫 Arma:</strong>
                    ${weaponNames[weapon]}
                    <div class="sensibility-description">${weaponTypes[weapon]}</div>
                </div>
                <div class="sensibility-item">
                    <strong>⚡ Perfil:</strong>
                    ${sensitivityName}
                </div>
                <div class="sensibility-item" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none;">
                    <strong style="color: white;">🎯 SENSIBILIDAD RECOMENDADA (Calibrada):</strong>
                    <div class="sensibility-value" style="color: #FFD700;">${dpiAdjustedValue}${dpiInfo}</div>
                    <div class="sensibility-description" style="color: #E0E0E0;">
                        ✓ Máximo Juego: 200 | ✓ Rango Óptimo: ${Math.round(finalValue * 0.8)} - ${finalValue}
                    </div>
                </div>

                <div class="stability-indicator stability-${baseData.stability === 'Perfecta' || baseData.stability === 'Muy Alta' ? 'high' : 'medium'}">
                    📊 ESTABILIDAD: ${baseData.stability} | FLUIDEZ: ${baseData.fluidity}
                </div>
            `;

            // Mostrar rango de valores seguros
            const minSafe = Math.round(finalValue * 0.85);
            const maxSafe = finalValue;
            resultHTML += `
                <div class="sensitivity-range">
                    <strong>🔒 Rango de Valores Estables:</strong>
                    <br>Mínimo: ${minSafe} | Máximo: ${maxSafe}
                    <br><small>Usa valores dentro de este rango para máxima estabilidad</small>
                </div>
            `;

            // Información de ajuste con DPI
            if (useDpi && dpiValue) {
                const dpiAdjustmentPercent = Math.round(((dpiAdjustedValue - finalValue) / finalValue) * 100);
                resultHTML += `
                    <div class="dpi-adjustment">
                        <strong>🎮 Ajuste por DPI (${dpiValue}):</strong>
                        <br>Valor base: ${finalValue} → Valor ajustado: ${dpiAdjustedValue}
                        <br>Cambio: ${dpiAdjustmentPercent > 0 ? '+' : ''}${dpiAdjustmentPercent}%
                    </div>
                `;
            }

            // Comparativa con otras plataformas
            const otherPlatform = platform === 'android' ? 'iphone' : 'android';
            const otherValue = sensibilityData[weapon][sensitivity][otherPlatform];
            const otherPlatformName = otherPlatform === 'android' ? '📱 Android' : '🍎 iPhone';

            resultHTML += `
                <div class="sensibility-item" style="background: #fff3cd; border-left: 4px solid #ffc107;">
                    <strong>💡 Recomendación para ${otherPlatformName}:</strong>
                    <div class="sensibility-value" style="color: #ff9800;">${otherValue}</div>
                </div>
            `;

            // Tips de calibración
            const tips = getTips(sensitivity, weapon, platform);
            resultHTML += `
                <div class="calibration-tips">
                    <strong>🎓 PASOS PARA CALIBRACIÓN PERFECTA:</strong>
                    <ul>
                        ${tips.map(tip => `<li>${tip}</li>`).join('')}
                    </ul>
                </div>
            `;

            // Advertencia importante
            resultHTML += `
                <div class="warning-box">
                    ⚠️ <strong>IMPORTANTE:</strong> Estas sensibilidades están calibradas para FLUIDEZ y ESTABILIDAD. 
                    Prueba en Training Ground antes de usarlas en partidas competitivas.
                </div>
            `;

            document.getElementById('resultContent').innerHTML = resultHTML;
            document.getElementById('result').classList.add('show');

            // Guardar en localStorage
            localStorage.setItem('lastConfig', JSON.stringify({
                platform, weapon, sensitivity, useDpi, dpiValue, finalValue: dpiAdjustedValue
            }));
        }

        function getTips(sensitivity, weapon, platform) {
            const generalTips = [
                '✓ Abre Training Ground y practica 5-10 minutos',
                '✓ Intenta hacer headshots a objetivos estacionarios',
                '✓ Luego practica con enemigos en movimiento',
                '✓ Si es muy rápido/lento, ajusta ±5 valores',
                '✓ Espera 2-3 días para acostumbrarte completamente'
            ];

            const weaponSpecificTips = {
                ak47: [
                    '✓ AK47 tiene mucho retroceso - usa baja sensibilidad',
                    '✓ Apunta al torso y deja que el retroceso suba a la cabeza',
                    '✓ En distancia media, burst fire para mejor control',
                    '✓ Practica la compensación del retroceso'
                ],
                m14: [
                    '✓ M14: Retroceso predecible - semiauto poderoso',
                    '✓ Perfecto para medium range engagements',
                    '✓ Cada disparo requiere re-aim preciso',
                    '✓ Mantén la sensibilidad estable'
                ],
                scar: [
                    '✓ SCAR es versátil - funciona en cualquier rango',
                    '✓ Retroceso balanceado - buen arma para aprender',
                    '✓ Usa para practicar diferentes distancias',
                    '✓ Ideal para jugadores consistentes'
                ],
                mp40: [
                    '✓ MP40: Baja sensibilidad incluso con high sens',
                    '✓ Excelente para CQC (combate cerrado)',
                    '✓ Mantén los movimientos cortos y rápidos',
                    '✓ Practica tracking a corta distancia'
                ],
                shotgun: [
                    '✓ Escopeta: One-shot lethality en corto alcance',
                    '✓ Posicionate correctamente - no depende tanto de sens',
                    '✓ Practica el pre-aim en esquinas',
                    '✓ Usa para gatillar combates en tu favor'
                ],
                sniper: [
                    '✓ Francotirador: Precisión = sensibilidad BAJA siempre',
                    '✓ Ajusta micro-movimientos para headshots',
                    '✓ Practica flick shots en Training',
                    '✓ Pre-aim posiciones comunes del enemigo'
                ],
                awm: [
                    '✓ AWM: One-shot a cualquier rango - máxima precisión',
                    '✓ Cada fallo es crítico - necesitas control absoluto',
                    '✓ Practica 10+ minutos diarios',
                    '✓ Domina antes de usar en competencia'
                ],
                groza: [
                    '✓ GROZA: Híbrido versátil - función como AR',
                    '✓ Retroceso bajo comparado a otros ARs',
                    '✓ Usa en rangos medios-cortos',
                    '✓ Perfecto para adapterlo rápidamente'
                ],
                deagle: [
                    '✓ Deagle: Arma de precisión - baja sensibilidad',
                    '✓ Cada disparo es crítico',
                    '✓ Practica el timing entre disparos',
                    '✓ Excelente para pulir puntería'
                ]
            };

            return weaponSpecificTips[weapon] || generalTips;
        }

        function copiarResultado() {
            const platform = document.getElementById('platform').value;
            const weapon = document.getElementById('weapon').value;
            const sensitivity = document.querySelector('input[name="sensitivity"]:checked').value;
            const useDpi = document.getElementById('useDpi').checked;
            const dpiValue = document.getElementById('dpiValue').value;
            
            const baseData = sensibilityData[weapon][sensitivity];
            let finalValue = baseData[platform];
            if (finalValue > 200) finalValue = 200;

            let dpiAdjustedValue = finalValue;
            if (useDpi && dpiValue) {
                const dpiBase = 400;
                const dpiRatio = dpiValue / dpiBase;
                dpiAdjustedValue = Math.round(finalValue / (dpiRatio * 0.8));
                dpiAdjustedValue = Math.max(1, Math.min(200, dpiAdjustedValue));
            }

            const platformName = platform === 'android' ? 'Android' : 'iPhone';

            const texto = `
🔴 CONFIGURACIÓN FREE FIRE - CALIBRADA PARA FLUIDEZ Y ESTABILIDAD

📱 Plataforma: ${platformName}
🔫 Arma: ${weaponNames[weapon]}
⚡ Sensibilidad: ${sensitivity.charAt(0).toUpperCase() + sensitivity.slice(1)}
🎯 Valor Recomendado: ${dpiAdjustedValue}
📊 Estabilidad: ${baseData.stability}
🌊 Fluidez: ${baseData.fluidity}
${useDpi ? `🎮 DPI: ${dpiValue}` : ''}

⚠️ MÁXIMO PERMITIDO EN JUEGO: 200

PASOS PARA CALIBRAR:
1. Ve a Training Ground
2. Aplica la sensibilidad sugerida
3. Practica 5-10 minutos
4. Si es necesario, ajusta ±5 valores
5. Espera 2-3 días para acostumbrarte

Generador de Sensibilidades Free Fire
https://github.com/isaacffmendoza-web/sensibilidades-free-fire
            `;

            navigator.clipboard.writeText(texto).then(() => {
                alert('✓ Configuración copiada al portapapeles (Max: 200)');
            });
        }

        // Cargar última configuración si existe
        window.addEventListener('load', function() {
            const lastConfig = localStorage.getItem('lastConfig');
            if (lastConfig) {
                const config = JSON.parse(lastConfig);
                document.getElementById('platform').value = config.platform;
                document.getElementById('weapon').value = config.weapon;
                document.querySelector(`input[value="${config.sensitivity}"]`).checked = true;
                if (config.useDpi) {
                    document.getElementById('useDpi').checked = true;
                    document.getElementById('dpiGroup').style.display = 'block';
                    document.getElementById('dpiValue').value = config.dpiValue;
                }
            }
        });

        // Mensaje de activación al cargar
        window.addEventListener('load', function() {
            console.log('✓ Generador de Sensibilidades ACTIVADO');
            console.log('✓ Sistema calibrado para máxima fluidez y estabilidad');
            console.log('✓ Máximo: 200 - Sensibilidades optimizadas');
        });
    </script>
</body>
</html>
